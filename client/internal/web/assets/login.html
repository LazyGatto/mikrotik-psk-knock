<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mkpk-provision</title>
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="/style.css">
<style>
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-card { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border);
                border-radius: var(--radius-lg); padding: 26px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.18); }
  .login-card h1 { font-size: 17px; margin: 10px 0 2px; }
  .login-card .sub { color: var(--muted); font-size: 11.5px; margin-bottom: 18px; }
  .login-card input { width: 100%; }
  .login-card .err { color: var(--danger); font-size: 11.5px; margin-top: 10px; }
  .login-card .foot { color: var(--faint); font-size: 10.5px; margin-top: 16px; font-family: var(--mono); }
  .login-card img { width: 40px; height: 40px; }
</style>
</head>
<body>
<div class="login-wrap">
  <form class="login-card" method="POST" action="/login">
    <img src="/logo-96.png" alt="mkpk">
    <h1>mkpk-provision</h1>
    <div class="sub">Enter the admin password to continue.</div>
    <input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password" required>
    <div class="err">__MKPK_ERROR__</div>
    <div class="row" style="margin-top:14px">
      <span class="spacer"></span>
      <button class="btn pri" type="submit">Sign in</button>
    </div>
    <div class="foot">__MKPK_VERSION__</div>
  </form>
</div>
</body>
</html>
