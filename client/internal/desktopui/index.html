<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>mkpk</title>
<style>
  :root {
    --bg: #16181d; --card: #1e2128; --border: #2b2f38;
    --fg: #e8eaee; --dim: #8b919c; --accent: #4f8cff;
    --open: #3fb26f; --closed: #e05555; --warn: #d9a13c;
  }
  html[data-theme="light"] {
    --bg: #f2f3f6; --card: #ffffff; --border: #dfe3ea;
    --fg: #1d2026; --dim: #6a7180; --accent: #3574e6;
    --open: #1f9d57; --closed: #cc3d3d; --warn: #a87718;
  }
  * { box-sizing: border-box; margin: 0; }
  html { height: 100%; }
  /* Column layout instead of a fixed footer: a fixed one sat on top of the
     last service row as soon as the list scrolled. */
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    padding: 14px; user-select: none;
    min-height: 100%; display: flex; flex-direction: column;
    overflow-x: hidden;
  }
  main { flex: 1 1 auto; }
  header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  header .title { font-size: 15px; font-weight: 700; }
  header .spacer { flex: 1; }
  button {
    background: var(--card); color: var(--fg);
    border: 1px solid var(--border); border-radius: 7px;
    padding: 5px 12px; font: inherit; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .lang { min-width: 40px; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px; margin-bottom: 10px;
  }
  .invite-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .invite-head .cid { font-weight: 600; }
  .invite-head .x { margin-left: auto; color: var(--dim); background: none; border: none; padding: 2px 6px; }
  .invite-head .x:hover { color: var(--closed); }
  .router { color: var(--dim); font-size: 11.5px; margin: 6px 0 4px; }
  .svc {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 7px 0; border-top: 1px solid var(--border);
  }
  /* The name column shrinks first; when the controls still do not fit they
     wrap to their own line instead of pushing the Knock button off-window. */
  .svc .info { flex: 1 1 45%; min-width: 0; }
  .svc .actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .svc .name { font-weight: 600; }
  .svc .meta { color: var(--dim); font-size: 11px; }
  .chip {
    font-size: 11px; padding: 2px 9px; border-radius: 99px;
    border: 1px solid var(--border); color: var(--dim); white-space: nowrap;
  }
  .chip.open   { color: var(--open);   border-color: var(--open); }
  .chip.closed { color: var(--closed); border-color: var(--closed); }
  .chip.error  { color: var(--warn);   border-color: var(--warn); }
  .chip.busy   { color: var(--accent); border-color: var(--accent); }
  .empty { color: var(--dim); text-align: center; padding: 34px 10px; }
  .svc .gear { background: none; border: none; color: var(--dim); padding: 2px 4px; font-size: 13px; }
  .svc .gear:hover { color: var(--accent); }
  .svc .gear.on { color: var(--open); }
  .launch { padding: 0 0 8px; }
  .launch input {
    width: 100%; background: var(--bg); color: var(--fg); font: 11.5px/1.4 inherit;
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px;
  }
  .launch .hint { color: var(--dim); font-size: 10.5px; margin-top: 4px; }
  .toast {
    position: fixed; left: 14px; right: 14px; bottom: 44px; z-index: 60;
    background: var(--card); border: 1px solid var(--closed); border-radius: 8px;
    color: var(--closed); padding: 8px 12px; font-size: 12px; display: none;
  }
  footer {
    display: flex; color: var(--dim); font-size: 11px;
    margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--border);
  }
  footer .spacer { flex: 1; }
  footer a { color: var(--dim); text-decoration: none; cursor: pointer; }
  footer a:hover { color: var(--accent); }
  #file { display: none; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  .overlay.show { display: flex; }
  .about {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px 26px; width: 300px; text-align: center;
  }
  .about img { width: 72px; height: 72px; border-radius: 16px; }
  .about h2 { font-size: 16px; margin-top: 10px; }
  .about .ver { color: var(--dim); font-size: 11.5px; margin-top: 2px; }
  .about p { color: var(--dim); font-size: 11.5px; margin-top: 10px; line-height: 1.5; }
  .about .row { display: flex; gap: 8px; justify-content: center; margin-top: 14px; }
  .confirm { width: 280px; text-align: left; padding: 18px 20px; }
  .confirm p { color: var(--fg); font-size: 13px; margin: 0; }
  .confirm .row { justify-content: flex-end; }
</style>
</head>
<body>
<header>
  <span class="title">mkpk</span>
  <span class="spacer"></span>
  <button class="lang" id="aboutBtn" title="">?</button>
  <button class="lang" id="themeBtn" title=""></button>
  <button class="lang" id="langBtn"></button>
  <button class="primary" id="importBtn"></button>
  <input type="file" id="file" accept=".mkpk,.txt">
</header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<div class="overlay" id="aboutOverlay">
  <div class="about">
    <img src="/icon.png" alt="mkpk">
    <h2>mkpk</h2>
    <div class="ver">__MKPK_VERSION__</div>
    <p id="aboutText"></p>
    <div class="row">
      <button id="aboutGithub">GitHub</button>
      <button class="primary" id="aboutClose"></button>
    </div>
  </div>
</div>
<footer><span>mkpk · Knock first</span><span>&nbsp;·&nbsp;</span><a id="aboutLink">GitHub</a><span class="spacer"></span><span>__MKPK_VERSION__</span></footer>

<script>
"use strict";
const TOKEN = "__MKPK_TOKEN__";
const T = {
  import:        ["Import invite", "Импорт инвайта"],
  knock:         ["Knock", "Постучать"],
  knocking:      ["Knocking…", "Стучимся…"],
  open:          ["open", "открыто"],
  closed:        ["closed", "закрыто"],
  error:         ["error", "ошибка"],
  idle:          ["—", "—"],
  port:          ["port", "порт"],
  openFor:       ["opens for", "открывается на"],
  empty:         ["No invites yet. Import a .mkpk file you received from your admin.",
                  "Инвайтов пока нет. Импортируйте .mkpk-файл, который вам передал администратор."],
  removeConfirm: ["Remove this invite?", "Удалить этот инвайт?"],
  remove:        ["Remove", "Удалить"],
  cancel:        ["Cancel", "Отмена"],
  attempt_one:   ["attempt", "попытка"],
  attempt_few:   ["attempts", "попытки"],
  attempt_many:  ["attempts", "попыток"],
  update_title:  ["Update available", "Доступно обновление"],
  update_body:   ["Version {ver} has been released. You are running {cur}. Updating is optional — download it when convenient.",
                  "Вышла версия {ver}, у вас {cur}. Обновляться необязательно — скачайте, когда будет удобно."],
  update_open:   ["Open the release page", "Открыть страницу релиза"],
  update_later:  ["Later", "Позже"],
  theme_light:   ["Light theme", "Светлая тема"],
  theme_dark:    ["Dark theme", "Тёмная тема"],
  about_tip:     ["About mkpk", "О программе"],
  launch_tip:    ["Command to run after this service opens", "Команда, запускаемая после открытия сервиса"],
  launch_ph:     ["e.g. start \"\" mstsc /v:{host}:{port}", "например: start \"\" mstsc /v:{host}:{port}"],
  launch_hint:   ["Runs on this machine after a successful knock. {host}, {port}, {service} are substituted. Empty — nothing runs.",
                  "Выполняется на этой машине после успешного стука. {host}, {port}, {service} подставляются. Пусто — ничего не запускается."],
  launch_saved:  ["Command saved", "Команда сохранена"],
  launch_log:    ["Launch log:", "Журнал запусков:"],
  launch_failed: ["Command failed:", "Команда не выполнилась:"],
  launch_preset_ph:   ["admin preset: ", "пресет админа: "],
  launch_preset_hint: ["The admin already set what opens after this service — leave empty to use it, or type your own command to override it on this machine ({host}, {port}, {service} are substituted).",
                       "Админ уже задал, что открывать после стука — оставьте пусто, чтобы использовать это, либо впишите свою команду, она переопределит пресет на этой машине ({host}, {port}, {service} подставляются)."],
  launched:      ["launched", "запущено"],
  relaunch_tip:  ["Run the command again — no knock, the port is already open",
                  "Запустить команду повторно — без стука, порт уже открыт"],
  relaunch_closed: ["The port is closed now — knock again", "Порт уже закрыт — постучитесь заново"],
  about_text:    ["Knock first: a PSK time-token port-knock client for MikroTik routers. Import an invite, knock, connect.",
                  "Сначала постучись: клиент PSK-time port-knock для роутеров MikroTik. Импортируйте инвайт, постучитесь, подключайтесь."],
  close:         ["Close", "Закрыть"],
};
let lang = "en";
let theme = "dark";
const REPO_URL = "https://github.com/LazyGatto/mikrotik-psk-knock";
const t = (k) => T[k][lang === "ru" ? 1 : 0];

function applyTheme() {
  document.documentElement.dataset.theme = theme;
  const b = document.getElementById("themeBtn");
  b.textContent = theme === "dark" ? "☀" : "🌙";
  b.title = theme === "dark" ? t("theme_light") : t("theme_dark");
  document.getElementById("aboutBtn").title = t("about_tip");
  document.getElementById("aboutText").textContent = t("about_text");
  document.getElementById("aboutClose").textContent = t("close");
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "X-MKPK-Token": TOKEN, "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = "none"; }, 6000);
}

let state = { invites: [] };
const chips = {};   // "inviteId/router/service" → last result

function render() {
  document.getElementById("langBtn").textContent = lang === "ru" ? "EN" : "RU";
  document.getElementById("importBtn").textContent = t("import");
  const main = document.getElementById("main");
  main.textContent = "";
  if (!state.invites.length) {
    const d = document.createElement("div");
    d.className = "empty"; d.textContent = t("empty");
    main.appendChild(d);
    return;
  }
  for (const inv of state.invites) {
    const card = document.createElement("div"); card.className = "card";
    const head = document.createElement("div"); head.className = "invite-head";
    const cid = document.createElement("span"); cid.className = "cid"; cid.textContent = inv.client_id;
    const x = document.createElement("button"); x.className = "x"; x.textContent = "✕";
    x.onclick = async () => {
      // The webview's confirm() renders as "Сообщение с wails.localhost" —
      // a browser dialog inside what should look like a desktop app.
      if (!(await askConfirm(t("removeConfirm"), t("remove")))) return;
      try { await api("/api/remove", { id: inv.id }); await load(); }
      catch (e) { toast(e.message); }
    };
    head.append(cid, x); card.appendChild(head);
    for (const rt of inv.routers || []) {
      const rh = document.createElement("div"); rh.className = "router"; rh.textContent = rt.router;
      card.appendChild(rh);
      for (const svc of rt.services || []) {
        card.appendChild(svcRow(inv, rt, svc));
      }
    }
    main.appendChild(card);
  }
}

// "1 попыток" was wrong in every screenshot; Russian needs three forms.
function attempts(n) {
  if (lang !== "ru") return n + " " + t(n === 1 ? "attempt_one" : "attempt_many");
  const d = n % 10, h = n % 100;
  if (d === 1 && h !== 11) return n + " " + t("attempt_one");
  if (d >= 2 && d <= 4 && (h < 12 || h > 14)) return n + " " + t("attempt_few");
  return n + " " + t("attempt_many");
}

function chipText(last) {
  return t(last.cls) + (last.attempts != null ? " \u00b7 " + attempts(last.attempts) : "");
}

function svcRow(inv, rt, svc) {
  const key = inv.id + "/" + rt.router + "/" + svc.name;
  const box = document.createElement("div");
  const row = document.createElement("div"); row.className = "svc";
  const info = document.createElement("div"); info.className = "info";
  const name = document.createElement("div"); name.className = "name"; name.textContent = svc.name;
  const meta = document.createElement("div"); meta.className = "meta";
  meta.textContent = t("port") + " " + svc.check_port +
    (svc.allowed_timeout ? " · " + t("openFor") + " " + svc.allowed_timeout : "");
  info.append(name, meta);
  const actions = document.createElement("div"); actions.className = "actions";
  const chip = document.createElement("span"); chip.className = "chip";
  const last = chips[key];
  if (last) { chip.classList.add(last.cls); chip.textContent = chipText(last); }
  else { chip.textContent = t("idle"); }
  const hasCmd = () => !!(svc.launch || svc.launch_kind);

  // Local post-open command: typed by the user, stored on this machine only.
  const editor = document.createElement("div");
  editor.className = "launch"; editor.style.display = "none";
  const input = document.createElement("input");
  input.value = svc.launch || "";
  input.placeholder = svc.launch_kind ? t("launch_preset_ph") + svc.launch_kind.toUpperCase() : t("launch_ph");
  const hint = document.createElement("div"); hint.className = "hint";
  hint.textContent = svc.launch_kind ? t("launch_preset_hint") : t("launch_hint");
  if (state.launch_log) {
    const logLine = document.createElement("div");
    logLine.className = "hint";
    logLine.style.marginTop = "4px";
    logLine.textContent = t("launch_log") + " " + state.launch_log;
    editor.appendChild(logLine);
  }
  editor.append(input, hint);
  const save = async () => {
    const command = input.value.trim();
    if (command === (svc.launch || "")) return;
    try {
      await api("/api/launch", { invite_id: inv.id, router: rt.router, service: svc.name, command });
      svc.launch = command;
      gear.classList.toggle("on", hasCmd());
      again.style.display = hasCmd() ? "" : "none";
      bindReplay();
      toast(t("launch_saved"));
    } catch (e) { toast(e.message); }
  };
  input.onblur = save;
  input.onkeydown = (e) => { if (e.key === "Enter") input.blur(); };

  const gear = document.createElement("button");
  gear.className = "gear" + (svc.launch || svc.launch_kind ? " on" : "");
  gear.textContent = "⚙"; gear.title = t("launch_tip");
  gear.onclick = () => {
    const open = editor.style.display === "none";
    editor.style.display = open ? "block" : "none";
    if (open) input.focus();
  };

  const btn = document.createElement("button"); btn.textContent = t("knock");
  btn.onclick = () => knock(inv, rt, svc, chip, btn, key, bindReplay);

  // Re-run without knocking: the router's window is still open, only the
  // client-side session died. Also on the chip itself once it says "open" —
  // that is where the eye already is after a knock.
  const again = document.createElement("button");
  again.className = "gear"; again.textContent = "▶"; again.title = t("relaunch_tip");
  again.style.display = hasCmd() ? "" : "none";
  const replay = () => relaunch(inv, rt, svc, chip, [btn, again], key, bindReplay);
  again.onclick = replay;
  function bindReplay() {
    const on = hasCmd() && chips[key] && chips[key].cls === "open";
    chip.onclick = on ? replay : null;
    chip.style.cursor = on ? "pointer" : "";
    chip.title = on ? t("relaunch_tip") : "";
  }
  bindReplay();

  actions.append(gear, again, chip, btn);
  row.append(info, actions);
  box.append(row, editor);
  return box;
}

async function knock(inv, rt, svc, chip, btn, key, bindReplay) {
  btn.disabled = true;
  chip.onclick = null;
  chip.className = "chip busy"; chip.textContent = t("knocking");
  try {
    const res = await api("/api/knock", { invite_id: inv.id, router: rt.router, service: svc.name });
    const cls = res.status === "open" ? "open" : res.status === "closed" ? "closed" : "error";
    chips[key] = { cls, attempts: res.attempts };
    chip.className = "chip " + cls; chip.textContent = chipText(chips[key]);
    if (res.status !== "open" && res.error) toast(res.error);
    if (res.launch_error) toast(t("launch_failed") + " " + res.launch_error);
    else if (res.launched) {
      chip.textContent = chipText(chips[key]) + " · " + t("launched");
    }
  } catch (e) {
    chips[key] = { cls: "error" };
    chip.className = "chip error"; chip.textContent = chipText(chips[key]);
    toast(e.message);
  } finally {
    btn.disabled = false;
    bindReplay();
  }
}

// relaunch re-runs the service's command without knocking. The backend probes
// the port first, so a window that expired meanwhile comes back as "closed"
// instead of a launch into nothing.
async function relaunch(inv, rt, svc, chip, btns, key, bindReplay) {
  btns.forEach((b) => { b.disabled = true; });
  chip.onclick = null;
  const before = chip.className, beforeText = chip.textContent;
  chip.className = "chip busy";
  try {
    const res = await api("/api/relaunch", { invite_id: inv.id, router: rt.router, service: svc.name });
    if (res.status !== "open") {
      chips[key] = { cls: res.status === "closed" ? "closed" : "error", attempts: res.attempts };
      chip.className = "chip " + chips[key].cls; chip.textContent = chipText(chips[key]);
      toast(t("relaunch_closed"));
      return;
    }
    chips[key] = { cls: "open", attempts: res.attempts };
    chip.className = "chip open"; chip.textContent = chipText(chips[key]);
    if (res.launch_error) toast(t("launch_failed") + " " + res.launch_error);
    else if (res.launched) chip.textContent = chipText(chips[key]) + " · " + t("launched");
  } catch (e) {
    chip.className = before; chip.textContent = beforeText;
    toast(e.message);
  } finally {
    btns.forEach((b) => { b.disabled = false; });
    bindReplay();
  }
}

// A small in-app dialog: same overlay as About, Esc cancels, Enter confirms.
function askConfirm(text, okLabel) {
  return new Promise((resolve) => {
    const ov = document.createElement("div"); ov.className = "overlay show";
    const box = document.createElement("div"); box.className = "about confirm";
    const p = document.createElement("p"); p.textContent = text;
    const row = document.createElement("div"); row.className = "row";
    const no = document.createElement("button"); no.textContent = t("cancel");
    const yes = document.createElement("button"); yes.className = "primary"; yes.textContent = okLabel || "OK";
    const done = (v) => { document.removeEventListener("keydown", key); ov.remove(); resolve(v); };
    const key = (e) => { if (e.key === "Escape") done(false); if (e.key === "Enter") done(true); };
    no.onclick = () => done(false);
    yes.onclick = () => done(true);
    ov.onclick = (e) => { if (e.target === ov) done(false); };
    row.append(no, yes); box.append(p, row); ov.append(box);
    document.body.appendChild(ov);
    document.addEventListener("keydown", key);
    yes.focus();
  });
}

// Checked once per start. This client ships as a zip, so there is nothing to
// install from here — say that a newer version exists and offer the page.
async function checkUpdate() {
  let d;
  try { d = await api("/api/update"); } catch { return; } // offline: never nag
  if (!d || !d.newer) return;
  const ov = document.createElement("div"); ov.className = "overlay show";
  const box = document.createElement("div"); box.className = "about confirm";
  const head = document.createElement("h2"); head.style.fontSize = "15px"; head.textContent = t("update_title");
  const p = document.createElement("p");
  p.textContent = t("update_body").replace("{ver}", d.latest).replace("{cur}", d.current);
  const row = document.createElement("div"); row.className = "row";
  const later = document.createElement("button"); later.textContent = t("update_later");
  const open = document.createElement("button"); open.className = "primary"; open.textContent = t("update_open");
  later.onclick = () => ov.remove();
  open.onclick = () => { ov.remove(); api("/api/open", { url: d.url }).catch((e) => toast(e.message)); };
  row.append(later, open); box.append(head, p, row); ov.append(box);
  document.body.appendChild(ov);
}

document.getElementById("langBtn").onclick = async () => {
  lang = lang === "ru" ? "en" : "ru";
  render(); applyTheme();
  try { await api("/api/settings", { language: lang }); } catch (e) { /* non-fatal */ }
};

document.getElementById("themeBtn").onclick = async () => {
  theme = theme === "dark" ? "light" : "dark";
  applyTheme();
  try { await api("/api/settings", { theme }); } catch (e) { /* non-fatal */ }
};

document.getElementById("aboutLink").onclick = () => {
  api("/api/open", { url: REPO_URL }).catch((e) => toast(e.message));
};

const aboutOverlay = document.getElementById("aboutOverlay");
document.getElementById("aboutBtn").onclick = () => aboutOverlay.classList.add("show");
document.getElementById("aboutClose").onclick = () => aboutOverlay.classList.remove("show");
aboutOverlay.onclick = (e) => { if (e.target === aboutOverlay) aboutOverlay.classList.remove("show"); };
document.getElementById("aboutGithub").onclick = () => {
  api("/api/open", { url: REPO_URL }).catch((e) => toast(e.message));
};

document.getElementById("importBtn").onclick = () => document.getElementById("file").click();
document.getElementById("file").onchange = async (ev) => {
  const f = ev.target.files[0];
  ev.target.value = "";
  if (!f) return;
  try {
    const blob = (await f.text()).trim();
    await api("/api/import", { name: f.name, blob });
    await load();
  } catch (e) { toast(e.message); }
};

async function load() {
  const st = await api("/api/state");
  state = st;
  if (st.language === "ru" || st.language === "en") lang = st.language;
  if (st.theme === "light" || st.theme === "dark") theme = st.theme;
  render(); applyTheme();
}
load().then(checkUpdate).catch((e) => toast(e.message));
</script>
</body>
</html>
