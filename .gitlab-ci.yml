# CI for the Go module in client/. Runs on the `gitlab`-tagged runner so jobs
# stay on the local instance. The desktop package (cmd/mkpk-provision-desktop) is excluded
# from CI: it needs the platform webview (cgo/webkit) which the CI image doesn't
# carry — it is built on macOS via `make desktop`.

stages:
  - test
  - build
  - release

variables:
  # Keep the module and build cache inside the project dir so it can be cached.
  GOPATH: "$CI_PROJECT_DIR/.gocache"
  GOFLAGS: "-mod=mod"
  PKG_REGISTRY: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/mkpk/${CI_COMMIT_TAG}"

.go-cache: &go-cache
  cache:
    key: "go-mod"
    paths:
      - .gocache/pkg/mod

test:
  stage: test
  image: golang:1.26
  tags:
    - gitlab
  <<: *go-cache
  script:
    # The single quality gate — the same command agents and humans run locally.
    # It skips the desktop wrapper (needs a platform webview) and reports the
    # Swift stages as SKIP off macOS. The gate is this script's exit code.
    - bash scripts/verify.sh

# On a vX.Y.Z tag: cross-compile the CLI binaries and push them to the project's
# generic package registry, then attach them to a GitLab Release.
build:binaries:
  stage: build
  image: golang:1.26
  tags:
    - gitlab
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  <<: *go-cache
  script:
    - (command -v curl && command -v zip) >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends curl zip)
    - cd client
    - LDFLAGS="-s -w -X mikrotik-psk-knock/client/internal/version.Version=${CI_COMMIT_TAG}"
    - DIST="${CI_PROJECT_DIR}/dist"
    - mkdir -p "$DIST" stage
    # Each archive holds the binary under its plain name (mkpk / mkpk-provision);
    # the version/platform live on the .zip. Zipping also preserves the exec bit,
    # which a raw browser download would otherwise drop.
    - |
      for os in linux darwin windows; do
        for arch in amd64 arm64; do
          ext=""; [ "$os" = "windows" ] && ext=".exe"
          for bin in mkpk mkpk-provision; do
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -ldflags "$LDFLAGS" -o "stage/${bin}${ext}" ./cmd/$bin
            (cd stage && zip -q -j "$DIST/${bin}_${CI_COMMIT_TAG}_${os}_${arch}.zip" "${bin}${ext}")
            rm -f "stage/${bin}${ext}"
            echo "packaged ${bin}_${CI_COMMIT_TAG}_${os}_${arch}.zip"
          done
        done
      done
    # Windows GUI client (mkpk-client): the Wails Windows backend is cgo-free,
    # so it cross-compiles here like the CLIs. -H windowsgui hides the console.
    - |
      for arch in amd64 arm64; do
        GOOS=windows GOARCH=$arch go build -tags desktop,production -trimpath \
          -ldflags "$LDFLAGS -H windowsgui" -o stage/mkpk-client.exe ./cmd/mkpk-client
        (cd stage && zip -q -j "$DIST/mkpk-client_${CI_COMMIT_TAG}_windows_${arch}.zip" mkpk-client.exe)
        rm -f stage/mkpk-client.exe
        echo "packaged mkpk-client_${CI_COMMIT_TAG}_windows_${arch}.zip"
      done
    - cd "$CI_PROJECT_DIR"
    - |
      for f in dist/*.zip; do
        echo "uploading $(basename "$f")"
        curl --fail --silent --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${PKG_REGISTRY}/$(basename "$f")"
      done
  artifacts:
    paths:
      - dist/
    expire_in: 30 days

# macOS-артефакты на раннере mac-ci-01: оба приложения (нативный клиент и
# Wails provision-desktop) — сборка, Developer ID подпись, нотаризация, DMG,
# Sparkle-appcast; публикация в GitLab-релиз и на GitHub-зеркало.
# Провизия раннера (keychain, notary, EdDSA, wails): docs/plans/2026-08-26-macos-release-ci-plan.md.
release:macos:
  stage: release
  tags:
    - macos
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  needs:
    - build:binaries
    - release
  variables:
    # CFBundleVersion = git rev-list --count HEAD: на мелком клоне номер сборки
    # получится меньше прежнего и Sparkle сочтёт обновление даунгрейдом.
    GIT_DEPTH: "0"
  script:
    - export DEVELOPER_DIR=/Applications/Xcode.app/Contents/Developer
    - export PATH="$HOME/go/bin:/opt/homebrew/bin:$PATH"   # wails + brew go
    # Глобальный GOPATH=$CI_PROJECT_DIR/.gocache — для кеша linux-джоб. На маке
    # он кладёт READ-ONLY go-mod-кеш прямо в checkout, и следующий git clean
    # падает с Permission denied. Уводим GOPATH в домашний каталог раннера.
    - export GOPATH="$HOME/go"
    # sign_update пре-сидится на раннере (GitHub CDN оттуда нестабилен);
    # если файла нет — package_release.sh скачает его сам, с ретраями.
    - export SPARKLE_SIGN_UPDATE="$HOME/.gitlab-runner/sparkle-tools/bin/sign_update"
    - bash scripts/package_release.sh "$CI_COMMIT_TAG"

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - gitlab
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'
  needs:
    - build:binaries
  script:
    - |
      set -- create \
        --name "mkpk ${CI_COMMIT_TAG}" \
        --tag-name "${CI_COMMIT_TAG}" \
        --description "Automated release for ${CI_COMMIT_TAG}. CLI binaries (linux/darwin/windows) and the Windows GUI client are attached below; the release:macos job adds the signed+notarized macOS DMGs (mkpk-client, mkpk-provision-desktop) and mirrors everything to GitHub. Details: CHANGELOG.md."
      for f in dist/*.zip; do
        name=$(basename "$f")
        set -- "$@" --assets-link "{\"name\":\"${name}\",\"url\":\"${PKG_REGISTRY}/${name}\"}"
      done
      release-cli "$@"
